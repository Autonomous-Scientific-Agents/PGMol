name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install build pytest pytest-cov ruff
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=pgmol --cov-branch --cov-report=term-missing
      - run: pgmol core_xyz/H2O_C2v.xyz
