[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pgmol"
version = "0.1.0"
description = "Determine molecular Schoenflies point groups from Cartesian coordinates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PGMol contributors"}]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
pgmol = "pgmol.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgmol"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pgmol"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
